name: Ingest Opportunities

on:
  schedule:
    # Run at 1:00 AM UTC
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  ping-api:
    runs-on: ubuntu-latest
    steps:
      - name: Hit Vercel Cron Endpoint
        run: |
          API_URL="${{ secrets.API_URL || 'https://opportunity-os-eight.vercel.app' }}"
          CRON_SECRET="${{ secrets.CRON_SECRET || 'itida78evol0324i' }}"
          
          echo "Hitting endpoint: $API_URL/api/cron/ingest"
          curl -f -sS -X GET "$API_URL/api/cron/ingest" -H "Authorization: Bearer $CRON_SECRET"
