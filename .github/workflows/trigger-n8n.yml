name: Trigger n8n Pipelines
on:
  schedule:
    # Runs twice a day: 02:30 UTC and 14:30 UTC
    - cron: '30 2,14 * * *'
  workflow_dispatch: 

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Render instance
        run: |
          echo "Pinging n8n webhook to wake up the Render instance..."
          # We use a short 10-second timeout. It will likely timeout if asleep,
          # but the HTTP request reaches Render and triggers the cold start.
          curl -s -m 10 -X GET ${{ secrets.N8N_WEBHOOK_URL }} || true
          
      - name: Wait for Boot
        run: |
          echo "Waiting 75 seconds to ensure n8n is fully online..."
          sleep 75
          
      - name: Execute Pipeline
        run: |
          echo "Executing the actual pipeline(s)..."
          first=true
          # Iterate over each URL provided in the secret (separated by spaces or newlines)
          for url in ${{ secrets.N8N_WEBHOOK_URL }}; do
            if [ "$first" = true ]; then
              first=false
            else
              echo "Waiting 15 minutes (900 seconds) before triggering the next workflow to prevent API overload..."
              sleep 900
            fi
            echo "Triggering webhook..."
            response=$(curl -s -w "\n%{http_code}" -m 120 -X POST "$url")
            body=$(echo "$response" | sed '$d')
            status=$(echo "$response" | tail -n1)
            
            echo "Status Code: $status"
            echo "Response: $body"
            
            if [ "$status" -ge 400 ]; then
              echo "Error: Webhook failed!"
              exit 1
            fi
          done
