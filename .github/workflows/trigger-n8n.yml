name: Wake up n8n on Render
on:
  schedule:
    # Runs 5 minutes BEFORE your n8n schedules start
    # 8:00 AM IST = 2:30 UTC, 8:00 PM IST = 14:30 UTC
    # We wake up at 7:55 AM IST (2:25 UTC) and 7:55 PM IST (14:25 UTC)
    - cron: '25 2,14 * * *'
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  wake-up:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake up Render + Neon (attempt 1)
        run: |
          echo "Pinging n8n to wake up Render and Neon..."
          # This will likely fail (n8n can't connect to sleeping Neon),
          # but it wakes up BOTH services in the background.
          curl -s -m 30 -o /dev/null https://opportunity-os-n8n.onrender.com/ || true

      - name: Wait for Neon to fully wake up
        run: |
          echo "Waiting 90 seconds for Neon database to come online..."
          sleep 90

      - name: Wake up n8n again (attempt 2 — Neon is now ready)
        run: |
          echo "Pinging n8n again. Neon should be awake now..."
          # If n8n crashed on first attempt, Render auto-restarts it.
          # This second ping ensures n8n retries the DB connection.
          curl -s -m 30 -o /dev/null https://opportunity-os-n8n.onrender.com/ || true

      - name: Wait for n8n to fully boot
        run: |
          echo "Waiting 60 seconds for n8n to load workflows from database..."
          sleep 60

      - name: Verify n8n is alive
        run: |
          echo "Final health check..."
          status=$(curl -s -o /dev/null -w "%{http_code}" -m 15 https://opportunity-os-n8n.onrender.com/)
          echo "n8n responded with status: $status"
          if [ "$status" = "000" ]; then
            echo "WARNING: n8n did not respond. It may still be booting. Schedules will retry."
          else
            echo "n8n is online! Internal schedules will fire at 8:00 AM / 8:00 PM IST."
          fi
